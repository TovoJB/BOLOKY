name: vezo_translator_mobile
description: "Application mobile de traduction vocale Anglais vers Dialecte Vezo et Malagasy Officiel avec filtres audio DSP."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  record: 5.1.2
  audioplayers: ^6.0.0
  path_provider: ^2.1.2
  permission_handler: ^11.3.0
  shared_preferences: ^2.2.2
  cupertino_icons: ^1.0.6

dependency_overrides:
  record_platform_interface: 1.2.0
  record_linux: 0.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
